name: Release

on:
  push:
    tags:
      - v**
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: |
          pnpm run build

      # `zotero-plugin release` creates the tags *and* the releases, and fails
      # with `422 already_exists` when a release for a tag is already there. Both
      # tags it manages are therefore cleared first, so the scaffold recreates
      # them at the commit being released:
      #   - `v<version>`: carries the XPI,
      #   - `release`:    carries update.json, the fixed URL baked into the plugin.
      # Forgetting the second one leaves that manifest pointing at an older
      # commit, where its update_hash describes a different XPI than the one
      # published — and Zotero rejects an update whose hash does not match.
      - name: Drop the stale releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in "$GITHUB_REF_NAME" release; do
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "removing the release and tag $tag"
              gh release delete "$tag" --yes --cleanup-tag
            elif gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
              echo "removing the tag $tag (no release)"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag"
            else
              echo "nothing to remove for $tag"
            fi
          done
          sleep 5

      - name: Release to GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm run release
          sleep 1s

      # The scaffold may have re-pointed the tag; make sure it names the commit
      # that was actually released.
      - name: Point the tag back at the released commit
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse HEAD^{commit})"
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$GITHUB_REF_NAME" \
            -f sha="$sha" -F force=true

      # The scaffold creates the release without a description. The notes come
      # from CHANGELOG.md; the script falls back to the Unreleased section, so a
      # version without its own entry still gets something better than a bare
      # contributor list. POSIX sed only — an earlier awk version silently
      # matched nothing.
      - name: Describe the release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x tools/changelog-notes.sh
          tools/changelog-notes.sh "${GITHUB_REF_NAME#v}" > notes.md
          if [ -s notes.md ]; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            echo "no changelog content for $GITHUB_REF_NAME, leaving the release as created"
          fi

      - name: Notify release
        uses: apexskier/github-release-commenter@v1
        continue-on-error: true
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          comment-template: |
            :rocket: _This ticket has been resolved in {release_tag}. See {release_link} for release notes._
